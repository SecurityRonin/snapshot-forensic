name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # fmt · clippy · test (3 OS) · MSRV · cargo-deny · cargo-vet · secret scan ·
  # fuzz build-check · rustdoc · 100% per-line coverage · path-dep gate.
  #
  # No inputs: the old `coverage` job already enforced 100% per-line over
  # `--workspace`, failing on any `DA:n,0` that did not carry
  # `// cov:unreachable` — exactly the shared workflow's default gate. MSRV is
  # read from rust-version (1.81), which is what the old `msrv` job pinned by
  # hand. Anything configured here would be a behaviour change smuggled in by
  # an adoption PR, so there is nothing here.
  ci:
    uses: SecurityRonin/fleet-ci/.github/workflows/rust-ci.yml@f9802dca64a95eb881fd05dd3f4f16e53b97f2b3
